<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Читай-Город</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="cursor" id="cursor"></div>
    <div class="auth-page">
        <a href="index.html" class="auth-back">← На главную</a>
        <div class="auth-card">
            <h1 class="auth-title">Читай-Город</h1>
            
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">Вход</button>
                <button class="auth-tab" data-tab="register">Регистрация</button>
            </div>

            <!-- ФОРМА ВХОДА -->
            <form class="auth-form" id="loginForm">
                <div class="method-tabs">
                    <button type="button" class="method-tab active" data-method="password">По паролю</button>
                    <button type="button" class="method-tab" data-method="email">По коду из почты</button>
                </div>

                <div class="auth-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" required>
                </div>
                
                <div class="auth-group" id="passwordGroup">
                    <label>Пароль</label>
                    <input type="password" id="loginPassword">
                </div>

                <div class="auth-group" id="loginCodeGroup" style="display:none;">
                    <label>Код из письма</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="loginCodeInput" maxlength="6" placeholder="6 цифр" style="flex: 1;">
                        <button type="button" id="sendLoginCodeBtn" class="btn-small">Отправить</button>
                    </div>
                </div>

                <div class="auth-group" id="totpGroup" style="display:none;">
                    <label>Код Google Authenticator</label>
                    <input type="text" id="totpCodeInput" maxlength="6" placeholder="6 цифр">
                </div>

                <button type="submit" class="auth-submit" id="loginSubmitBtn">Войти</button>
                <p class="auth-error" id="loginError"></p>
                <p style="text-align:center; margin-top:15px;">
                    <a href="#" id="forgotPasswordLink" style="color:#e8d5b7; font-size:14px; text-decoration:none;">Забыли пароль?</a>
                </p>
            </form>

                        <!-- ФОРМА РЕГИСТРАЦИИ -->
            <form class="auth-form" id="registerForm" style="display:none;">
                
                <!-- ШАГ 1: Основные данные и Капча -->
                <div id="regStep1">
                    <div class="auth-group">
                        <label>Ваше имя</label>
                        <input type="text" id="regName" required placeholder="Иван Иванов">
                    </div>
                    <div class="auth-group">
                        <label>Email</label>
                        <div style="display: flex; gap: 10px;">
                            <input type="email" id="regEmail" required placeholder="example@mail.ru" style="flex: 1;">
                            <button type="button" id="sendRegCodeBtn" class="btn-small">Получить код</button>
                        </div>
                    </div>

                    <!-- Красивая капча -->
                    <div class="auth-group captcha-group">
                        <label>Проверка безопасности 🛡️</label>
                        <div class="captcha-box">
                            <span id="captchaQuestion" class="captcha-question"></span>
                            <input type="text" id="captchaInput" placeholder="Ответ" required maxlength="2">
                            <button type="button" id="refreshCaptcha" class="btn-icon" title="Обновить">🔄</button>
                        </div>
                    </div>

                    <div class="auth-group">
                        <label>Придумайте пароль</label>
                        <input type="password" id="regPassword" required minlength="6" placeholder="Минимум 6 символов">
                    </div>
                </div>

                <!-- ШАГ 2: Отдельная красивая плашка для кода (скрыта по умолчанию) -->
                <div id="regStep2" class="code-verification-panel" style="display:none;">
                    <div class="panel-header">
                        <span class="icon">✉️</span>
                        <h3>Проверьте вашу почту</h3>
                    </div>
                    <p class="panel-desc">Мы отправили 6-значный код на <b id="regEmailDisplay"></b>. Введите его ниже:</p>
                    
                    <div class="auth-group code-input-group">
                        <input type="text" id="verifyCode" maxlength="6" placeholder="0 0 0 0 0 0" class="code-input">
                    </div>
                    
                    <p class="resend-link">Не пришло? <a href="#" id="resendCodeLink">Отправить код повторно</a></p>
                </div>

                <button type="submit" class="auth-submit" id="registerSubmit">Зарегистрироваться</button>
                <p class="auth-error" id="registerError"></p>
                <p class="auth-success" id="registerSuccess"></p>
            </form>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
