<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сброс пароля — Читай-Город</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="cursor" id="cursor"></div>
    <div class="auth-page">
        <a href="index.html" class="auth-back">← На главную</a>
        <div class="auth-card">
            <h1 class="auth-title">Новый пароль</h1>
            <form class="auth-form" id="resetForm">
                <div class="auth-group">
                    <label>Новый пароль</label>
                    <input type="password" id="newPassword" required minlength="6">
                </div>
                <div class="auth-group">
                    <label>Повторите пароль</label>
                    <input type="password" id="confirmPassword" required minlength="6">
                </div>
                <button type="submit" class="auth-submit">Сохранить</button>
                <p class="auth-error" id="resetError"></p>
            </form>
        </div>
    </div>
    <script src="reset-password.js"></script>
</body>
</html>
