<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата заказа — Читай-Город</title>
    <link rel="stylesheet" href="payment.css">
</head>
<body>
    <div class="payment-page">
        <a href="index.html" class="payment-back">← Вернуться в каталог</a>
        <div class="payment-container" id="paymentContainer">
            <h1 class="payment-title">Оплата заказа</h1>
            <div class="payment-body">
                <div class="payment-order">
                    <h2>Ваш заказ</h2>
                    <div class="payment-user-info" id="paymentUserInfo"></div>
                    <div class="payment-items" id="paymentItems"></div>
                    <div class="payment-divider"></div>
                    <div class="payment-summary">
                        <div class="payment-row"><span>Товары:</span><span id="paymentSubtotal">0 ₽</span></div>
                        <div class="payment-row"><span>Скидка:</span><span id="paymentDiscount">0 ₽</span></div>
                        <div class="payment-row payment-row--total"><span>Итого:</span><span id="paymentTotal">0 ₽</span></div>
                    </div>
                </div>
                <div class="payment-form-section">
                    <h2>Данные карты</h2>
                    <div class="card-preview">
                        <div class="card-front">
                            <div class="card-number" id="cardPreviewNumber">•••• •••• •••• ••••</div>
                            <div class="card-expiry" id="cardPreviewExpiry">MM/YY</div>
                            <div class="card-name" id="cardPreviewName">ИМЯ ФАМИЛИЯ</div>
                        </div>
                    </div>
                    <form id="paymentForm">
                        <div class="form-group">
                            <label>Номер карты</label>
                            <input type="text" placeholder="0000 0000 0000 0000" id="cardNumber" maxlength="19" required>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Срок действия</label>
                                <input type="text" placeholder="MM/YY" id="cardExpiry" maxlength="5" required>
                            </div>
                            <div class="form-group">
                                <label>CVC</label>
                                <input type="text" placeholder="123" id="cardCvc" maxlength="3" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Email для чека</label>
                            <input type="email" id="receiptEmail" required>
                        </div>
                        <button type="submit" class="payment-submit" id="paymentSubmit">
                            Оплатить <span id="paymentSubmitAmount">0 ₽</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div class="payment-success" id="paymentSuccess" style="display:none;">
            <div class="success-container">
                <div class="success-icon">✓</div>
                <h1>Оплата выполнена!</h1>
                <p>Спасибо за покупку, <span id="successName"></span>!</p>
                <div class="success-receipt">
                    <h3>Чек</h3>
                    <div class="receipt-items" id="receiptItems"></div>
                    <div class="receipt-total"><span>Оплачено:</span><span id="receiptTotal">0 ₽</span></div>
                    <div class="receipt-id">ID заказа: <span id="receiptId"></span></div>
                    <div class="receipt-date">Дата: <span id="receiptDate"></span></div>
                </div>
                <button class="success-btn" id="successBtn">Перейти в аккаунт</button>
            </div>
        </div>
    </div>
    <script src="books.js"></script>
    <script src="payment.js"></script>
</body>
</html>
